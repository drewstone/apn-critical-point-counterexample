name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every claim re-verifies from the value tables with stdlib-only field and Galois-ring
      # arithmetic, including the GR(4, 9) lift. Non-zero exit means a check failed.
      - run: python3 verify.py --all
